name: keep-alive

# A free Supabase project pauses after 7 days idle, and the next request then
# waits 10-30s for a cold start. /api/health runs a query, so pinging it twice
# a week counts as database activity and resets that timer.
on:
  schedule:
    - cron: "17 6 * * 1,4" # Mondays and Thursdays
  workflow_dispatch: # so it can be triggered by hand if it ever does pause

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sSf https://squat.mvhuysie.com/api/health
